<VirtualHost *:80>
    ServerName   admin.inter-nat.com
    DocumentRoot "/var/www/html/innter_nat_admin/public/"
    ErrorLog     "/var/www/html/innter_nat_admin/error.log"
    CustomLog    "/var/www/html/innter_nat_admin/access.log" combined

    <Directory "/var/www/html/innter_nat_admin/public">
        Options +Indexes +FollowSymLinks
        DirectoryIndex index.php
        AllowOverride None
        Require all granted
        <IfModule mod_rewrite.c>
            <IfModule mod_negotiation.c>
                Options -MultiViews
            </IfModule>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.php [L]
            RewriteCond %{HTTP:Authorization} .
            RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        </IfModule>
    </Directory>

</VirtualHost>